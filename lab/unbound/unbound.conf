server:
    interface: 0.0.0.0
    port: 53
    access-control: 127.0.0.0/8 allow
    access-control: 172.30.0.0/24 allow
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    root-hints: "/opt/unbound/etc/unbound/root.hints"
    trust-anchor-file: "/opt/unbound/etc/unbound/private-root/root.key"

    # Unbound treats the reserved .test suffix as a local negative zone by
    # default. Let our private root hierarchy answer it instead.
    local-zone: "test." nodefault

    # Enforce validation from the private simulated root. No public trust
    # anchor or forwarding fallback is configured.
    harden-dnssec-stripped: yes
    val-permissive-mode: no

    cache-min-ttl: 0
    cache-max-ttl: 30
    prefetch: no
    verbosity: 2
    use-syslog: no

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-use-cert: no

