options {
    directory "/var/lib/bind";
    key-directory "/var/lib/bind/keys";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    dnssec-validation no;
};

include "/opt/lab/bootstrap.key";

zone "." IN {
    type master;
    file "db.root";
    dnssec-policy default;
    inline-signing yes;
    update-policy {
        grant root-bootstrap name test. DS;
    };
};

