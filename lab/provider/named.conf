options {
    directory "/var/lib/bind";
    key-directory "/var/lib/bind/keys";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    dnssec-validation no;
};

include "/opt/lab/rollover-control.key";

// Scenario-only control channel. It is reachable solely on the internal
// Docker network and still requires the dedicated TSIG key.
controls {
    inet 172.30.0.12 port 953
        allow { 172.30.0.0/24; }
        keys { "rollover-control"; };
};

// Same CSK architecture and algorithm as BIND's built-in default policy, with
// short synthetic-lab safety intervals so every rollover state is observable.
// Retired key files are retained for 90 days in the persistent volume.
dnssec-policy "lokey-rollover" {
    keys {
        csk lifetime unlimited algorithm ecdsap256sha256;
    };
    dnskey-ttl 30;
    publish-safety 10;
    retire-safety 10;
    purge-keys P90D;
    signatures-jitter 0;
    signatures-refresh 300;
    signatures-validity 3600;
    signatures-validity-dnskey 3600;
    max-zone-ttl 30;
    zone-propagation-delay 5;
    parent-ds-ttl 30;
    parent-propagation-delay 5;
};

zone "victim.test." IN {
    type master;
    file "db.victim.test";
    dnssec-policy lokey-rollover;
    inline-signing yes;
    update-policy {
        grant rollover-control name victim.test. A NS;
        grant rollover-control name ns.victim.test. A;
        grant rollover-control name www.victim.test. A;
        grant rollover-control name a.victim.test. TXT;
        grant rollover-control name t.victim.test. TXT;
        grant rollover-control name z.victim.test. TXT;
    };
};

