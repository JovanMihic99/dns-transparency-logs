options {
    directory "/var/lib/bind";
    key-directory "/var/lib/bind/keys";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    dnssec-validation no;
};

zone "victim.test." IN {
    type master;
    file "db.victim.test";
    dnssec-policy default;
    inline-signing yes;
    allow-update { none; };
};

