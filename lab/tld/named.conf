options {
    directory "/var/lib/bind";
    key-directory "/var/lib/bind/keys";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    dnssec-validation no;
};

include "/opt/lab/registrar.key";

zone "test." IN {
    type master;
    file "db.test";
    dnssec-policy default;
    inline-signing yes;
    update-policy {
        grant mock-registrar name victim.test. NS DS;
        grant mock-registrar name ns.attacker.test. A;
        grant mock-registrar name ns.unsigned.test. A;
        grant mock-registrar name ns.newprovider.test. A;
    };
};

