options {
    directory "/var/lib/bind";
    key-directory "/var/lib/bind/keys";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    dnssec-validation no;
};

dnssec-policy "lokey-migration-provider" {
    keys {
        csk lifetime unlimited algorithm ecdsap256sha256;
    };
    dnskey-ttl 30;
    publish-safety 10;
    retire-safety 10;
    purge-keys P90D;
    signatures-jitter 0;
    signatures-refresh 300;
    signatures-validity 3600;
    signatures-validity-dnskey 3600;
    max-zone-ttl 30;
    zone-propagation-delay 5;
    parent-ds-ttl 30;
    parent-propagation-delay 5;
};

zone "victim.test." IN {
    type master;
    file "db.victim.test";
    dnssec-policy lokey-migration-provider;
    inline-signing yes;
    allow-update { none; };
};
