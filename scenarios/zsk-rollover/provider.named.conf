options {
    directory "/var/lib/bind/current";
    key-directory "/var/lib/bind/current/keys";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    dnssec-validation no;
    dnssec-dnskey-kskonly yes;
};

include "/opt/lab/rollover-control.key";

controls {
    inet 172.30.0.12 port 953
        allow { 172.30.0.0/24; }
        keys { "rollover-control"; };
};

zone "victim.test." IN {
    type master;
    file "db.victim.test";
    inline-signing yes;
    auto-dnssec maintain;
    update-policy {
        grant rollover-control name victim.test. A NS;
        grant rollover-control name ns.victim.test. A;
        grant rollover-control name www.victim.test. A;
        grant rollover-control name a.victim.test. TXT;
        grant rollover-control name t.victim.test. TXT;
        grant rollover-control name z.victim.test. TXT;
    };
};
