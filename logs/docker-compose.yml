services:
  lokey:
    container_name: lokey

    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${LOKEY_UID:-1000}
        GID: ${LOKEY_GID:-1000}

    user: "${LOKEY_UID:-1000}:${LOKEY_GID:-1000}"

    ports:
      - "5000:5000"

    environment:
      LOKEY_DATA_DIR: /app/data

    volumes:
      - ./data:/app/data:Z

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - path: .env
        required: false